[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pathfinder"
version = "0.1.0"
description = "Evidence-graded walking navigation for Maryland's 6th congressional district"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.0",
    "pyogrio>=0.9",
    "shapely>=2.0",
    "pyproj>=3.6",
    "rasterio>=1.4",
    "igraph>=0.11",
    "osmium>=4.0",
    "requests>=2.31",
    "pyarrow>=15",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pmtiles>=3.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "networkx>=3.2", "httpx>=0.27"]
tools = ["mapbox-vector-tile>=2.2"]

[project.scripts]
pf = "pathfinder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "data: tests that need the built Phase 0 data artifacts (skipped if absent)",
]
